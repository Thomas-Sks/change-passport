    trace_patterns: ['DeclaringSyntaxReferences', 'GetPropertyIdentifierLocation']
  - id: C2
    text: "Diagnostics about members of such a type are reported by the defining assembly, not by the consuming project (the analyzer only reports on members declared in the project being compiled)."
    criteria: [AC-4]
    trace_patterns: ['ReportIfLocatedInCompilation', 'reportAnalyzerDiagnostic', 'IsInSource']
  - id: C3
    text: "Documentation describes the new behaviour."
    criteria: []
