# Written from the ISSUE TEXT ONLY, before reading the agent's fix (14/11/2026). Locked.
acceptance_criteria:
  - id: AC-1
    text: "Neither the generator (CS8785) nor the analyzer (AD0001) crashes when a [MessagePackObject] type has a member whose type is a closed generic value type (struct or record struct) declared in a referenced assembly."
  - id: AC-2
    text: "In that case, the consuming assembly gets a generated resolver that provides a formatter for the type."
  - id: AC-3
    text: "At runtime, such a type round-trips (serialize then deserialize) with the generated resolver."
  - id: AC-4
    text: "Cases that already worked (non-generic struct, generic class, generic struct declared in the same assembly) keep working."

# Claims: taken from the agent's README / doc after the criteria were locked.
claims:
